[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lowpack"
version = "0.1.0"
description = "Application-aware, lossless local-first packing built on proven codecs."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "devkyato" }]
dependencies = ["zstandard>=0.22"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10,<1.19",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
lowpack = "lowpack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lowpack"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["lowpack"]
mypy_path = "src"
